name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (8 + 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Cnab.slnx

      - name: Build (warnings as errors)
        run: dotnet build Cnab.slnx -c Release --no-restore

      - name: Test (net8.0 + net10.0)
        run: dotnet test tests/Cnab.Tests/Cnab.Tests.csproj -c Release --no-build

      - name: Lint (dotnet format)
        run: dotnet format Cnab.slnx --verify-no-changes --no-restore
