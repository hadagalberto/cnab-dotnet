name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (8 + 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Cnab.slnx

      - name: Build (warnings as errors)
        run: dotnet build Cnab.slnx -c Release --no-restore

      - name: Test (net8.0 + net10.0)
        run: dotnet test tests/Cnab.Tests/Cnab.Tests.csproj -c Release --no-build

      - name: CLI smoke (validate/parse/inspect/generate)
        run: |
          dotnet run --project src/Cnab.Cli -c Release --no-build --framework net10.0 -- validate tests/Cnab.Tests/Golden/341_cobranca_400.rem
          dotnet run --project src/Cnab.Cli -c Release --no-build --framework net10.0 -- parse tests/Cnab.Tests/Golden/341_cobranca_400.ret --json
          dotnet run --project src/Cnab.Cli -c Release --no-build --framework net10.0 -- inspect tests/Cnab.Tests/Golden/341_cobranca_400.rem --bank 341
          dotnet run --project src/Cnab.Cli -c Release --no-build --framework net10.0 -- generate examples/titulos.json --bank 237 --layout 400 --output "$RUNNER_TEMP/remessa.rem"

      - name: Lint (dotnet format)
        run: dotnet format Cnab.slnx --verify-no-changes --no-restore
